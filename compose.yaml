services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=url_shortener'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=postgres'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/MAJOR/docker

volumes:
  postgres_data:
